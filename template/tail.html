      </div>
      <div id="editor">
        <div id="input-wrapper" class="input-wrapper">
          <label for="clips1">1</label>
          <pre id="clips1" class="input" contenteditable="true" spellcheck="false">
          </div>
          <div id="controls">
            <div id="clearResetWrapper">
              <button id="clear">(clear)</button>
              <button id="reset">(reset)</button>
            </div>
            <div id="batchStarWrapper">
              <button id="batchStar">(batch*)</button>
            </div>
          </div>
        <span>Output:</span>
          <div class="output-wrapper">
          <pre id="clips1-output" class="output"></pre>
          </div>
      </div>
    </div>
    <script>
      // Chapters are addressed by their slug (#saying-hello): it survives
      // reordering and retitling, so it is what every link on the page uses.
      // The chapter's position (#1) stays valid as an alias for older links,
      // but it moves whenever chapters-index changes.
      const sections = Array.from(document.querySelectorAll('section'));
      const byHash = new Map();
      sections.forEach(function(s, i) {
              byHash.set(s.id, s);                    // #saying-hello (canonical)
              byHash.set(String(i), s);               // #1 (legacy alias)
      });
      // sectionFor(): resolve a location.hash to a section, defaulting to the
      // first chapter for an empty or unrecognized hash.
      function sectionFor(hash) {
              return byHash.get((hash || '').replace(/^#/, '')) || sections[0];
      }
      const currents = document.getElementsByClassName('current');
      let select = document.createElement('select');
      let chapterSelects = [];
      for (let i = 0; i < currents.length; i++) {
              let option = document.createElement('option');
              option.text = currents[i].textContent;
              option.value = sections[i].id;
              chapterSelects.forEach((e) => e.appendChild(option.cloneNode(true)));
              select.appendChild(option);
              let chapterSelect = select.cloneNode(true);
              chapterSelect.addEventListener('change', function(e) {
                      window.location.hash = `#${e.target.value}`;
                      e.target.value = sections[i].id;
              });
              chapterSelect.value = sections[i].id;
              chapterSelects.push(chapterSelect);
      }
      for (let i = 0; i < chapterSelects.length; i++) {
              let li = currents[i];
              li.innerHTML = '';
              li.appendChild(chapterSelects[i]);
      }
      function getCaretCharacterOffsetWithin(element) {
              var caretOffset = 0;
              var doc = element.ownerDocument || element.document;
              var win = doc.defaultView || doc.parentWindow;
              var sel;
              if (typeof win.getSelection != "undefined") {
                      sel = win.getSelection();
                      if (sel.rangeCount > 0) {
                              var range = win.getSelection().getRangeAt(0);
                              var preCaretRange = range.cloneRange();
                              preCaretRange.selectNodeContents(element);
                              preCaretRange.setEnd(range.endContainer, range.endOffset);
                              caretOffset = preCaretRange.toString().length;
                            }
                    } else if ( (sel = doc.selection) && sel.type != "Control") {
                            var textRange = sel.createRange();
                            var preCaretTextRange = doc.body.createTextRange();
                            preCaretTextRange.moveToElementText(element);
                            preCaretTextRange.setEndPoint("EndToEnd", textRange);
                            caretOffset = preCaretTextRange.text.length;
                          }
              return caretOffset;
            }
      // Move caret to a specific point in a DOM element
      function SetCaretPosition(el, pos){
              // Loop through all child nodes
              for(var node of el.childNodes){
                      if(node.nodeType == 3){ // we have a text node
                              if(node.length >= pos){
                                      // finally add our range
                                      var range = document.createRange(),
                                        sel = window.getSelection();
                                      range.setStart(node,pos);
                                      range.collapse(true);
                                      sel.removeAllRanges();
                                      sel.addRange(range);
                                      return -1; // we are done
                                    }else{
                                            pos -= node.length;
                                          }
                            }else{
                                    pos = SetCaretPosition(node,pos);
                                    if(pos == -1){
                                            return -1; // no need to finish the for loop
                                          }
                                  }
                    }
              return pos; // needed because of recursion stuff
            }
      /** @type {function(string, boolean=, number=)} */
      function intArrayFromString(stringy, dontAddNull, length) {
        var len = length > 0 ? length : Module.lengthBytesUTF8(stringy)+1;
        var u8array = new Array(len);
        var numBytesWritten = Module.stringToUTF8Array(stringy, u8array, 0, u8array.length);
        if (dontAddNull) u8array.length = numBytesWritten;
        return u8array;
      }
      let stdinput = [];
      var Module = {
              stdin: function() {
                      if (stdinput.length === 0) {
                              stdinput = intArrayFromString((prompt() || "") + "\n", true);
                              stdinput.push(null);
                            }
                      return stdinput.shift();
              },
              print: function(output) {
                      if (output) document.getElementById('clips1-output').innerText += `${output}\n` },
              printErr: function(output) {
                      if (output) document.getElementById('clips1-output').innerText += `${output}\n` },
            };
      // text-editor stuff
      let highlight = function(e, entr) {
        let sel = window.getSelection();
        let pre = e.getElementsByTagName('pre')[0];
        let position = getCaretCharacterOffsetWithin(pre);
        let range = document.createRange();

        let highlighted = pre.innerText.replaceAll(/(\n*)(;.*)(\n*)/g, "$1<span class='Comment'>$2</span>$3");
        highlighted = highlighted.replaceAll(/"(([^"\\]|\\.)*)"/g, "<span class=\"Constant\">\"$1\"</span>")
        highlighted = highlighted.replaceAll(/\((def(?:rule|template|function|facts)) ([^\d]\s+|[^\s][^\s]+)/g, "(<span class=\"Type\">$1</span> <span class=\"DefName\">$2</span>");
        highlighted = highlighted.replaceAll(/(\s|~|\()(\$)?\?([a-zA-Z]\w*)*/g, "$1<span class=\"Identifier\">$2?$3</span>")
        highlighted = highlighted.replaceAll(/\((retract|run|println|printout|print|assert|format|clear|reset|facts|rules|explode\$|length\$)(\s)?/g, "(<span class=\"Statement\">$1</span>$2")
        pre.innerHTML = highlighted;

        sel.removeAllRanges();
        if (entr) {
          position++;
        }
        SetCaretPosition(pre, position);
      }
      let lineNumber = function(e) {
        let label = e.getElementsByTagName('label')[0];
        let pre = e.getElementsByTagName('pre')[0];
        let lastLineNumber = (pre.innerText.match(/\n/g) || []).length + 1;
        let labelText = lastLineNumber;
        while (lastLineNumber > 1) {
          labelText = `${--lastLineNumber}<br>${labelText}`;
        }
        label.innerHTML = labelText;
      }
      let renderText = function(e, evt=false) {
        lineNumber(e);
        highlight(e, evt);
      }
      for (wrap of document.getElementsByClassName('input-wrapper')) {
        renderText(wrap);
        let tabPrevent = function(event) {
          if (event.code == "Tab") {
            let pre = wrap.getElementsByTagName('pre')[0];
            let offset = getCaretCharacterOffsetWithin(pre);
            event.preventDefault();
            pre.innerText =
              pre.innerText.slice(0, offset) + "\t" +
                pre.innerText.slice(offset, pre.innerText.length);
            renderText(wrap);
            SetCaretPosition(pre, offset+1);
          }
        };
        wrap.addEventListener('input', function(event) {
          renderText(wrap, event.inputType == "insertParagraph") });
        wrap.addEventListener('keydown', tabPrevent);
      }

      for (ele of document.getElementsByClassName('documentation-input')) {
        ele.style.display = 'none';
      }
    </script>
    <script src="@CLIPS_JS_URL@">
    </script>
    <script>
      Module.onRuntimeInitialized = () => {
              let clipsEnvironment = Module._CreateEnvironment();
              document.getElementById('batchStar').addEventListener('click',
                      function(event) {
                              event.preventDefault();
                              document.getElementById('clips1-output').innerText = '';
                              let input = document.getElementById('clips1').innerText;
                              let filename = './clips.bat';
                              let lengthBytes = Module.lengthBytesUTF8(filename)+1;
                              let cFilename = Module._malloc(lengthBytes);
                              Module.stringToUTF8(filename, cFilename, Infinity);
                              Module.FS.writeFile('./clips.bat', input);
                              Module._BatchStar(clipsEnvironment, cFilename);
                              Module._free(cFilename);
                              Module.FS.unlink('./clips.bat');
                            }
                    );
              document.getElementById('clear').addEventListener('click',
                      function(event) {
                              event.preventDefault();
                              document.getElementById('clips1-output').innerText = '';
                              Module._Clear(clipsEnvironment);
                            }
                    );
              document.getElementById('reset').addEventListener('click',
                      function(event) {
                              event.preventDefault();
                              document.getElementById('clips1-output').innerText = '';
                              Module._Reset(clipsEnvironment);
                            }
                    );
      }
      // showSection(): reveal the chapter a hash points at, load its sample
      // into the editor, and clear the previous output.
      function showSection(hash) {
              let target = sectionFor(hash);
              document.getElementById('clips1').innerText =
                document.getElementById(`input-${target.id}`).innerText;
              renderText(document.getElementById('input-wrapper'));
              for (ele of sections) {
                      ele.style.display = ele === target ? "unset" : "none";
                    }
              document.getElementById('clips1-output').innerText = '';
              window.scrollTo(0,0);
            }
      addEventListener('hashchange', function(event) { showSection(location.hash) });
      // The first chapter is the no-hash landing view, so drop the hash when a
      // link (by slug or by number) points at it.
      if (location.hash && sectionFor(location.hash) === sections[0]) {
        location.hash = '';
      } else {
        window.scrollTo(0,0);
      }
      showSection(location.hash);
    </script>
  </body>
</html>
